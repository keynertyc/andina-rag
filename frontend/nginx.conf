server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    # HTML and CSP must share the nonce of this response, including after reload.
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    sub_filter_once on;
    sub_filter 'CSP_NONCE_PLACEHOLDER' '$request_id';
    gzip on;
    gzip_types text/css application/javascript application/json;
    location /api/ { proxy_pass http://api:8000; proxy_read_timeout 30s; }
    location / { try_files $uri $uri/ /index.html; }
}
